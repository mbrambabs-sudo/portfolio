<g filter="url(#shadow)"><rect x="1190" y="210" rx="18" width="140" height="130" fill="#fff"/><text x="1260" y="252" text-anchor="middle" fill="#0f766e" font-family="Arial" font-size="18" font-weight="700">DATA</text><text x="1260" y="282" text-anchor="middle" fill="#334155" font-family="Arial" font-size="16">SQLite</text><text x="1260" y="307" text-anchor="middle" fill="#334155" font-family="Arial" font-size="16">Relationships</text></g>
