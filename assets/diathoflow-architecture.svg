<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">DiathoFlow high-level architecture and security model</title>
<desc id="desc">High-level recruiter-safe architecture showing users, role-based access, frontend, backend business logic, database, diagnostics and intelligence.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0d1b2a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".16"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect width="1400" height="820" fill="url(#bg)"/>
<text x="70" y="70" fill="#f59e0b" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">DIATHOFLOW</text>
<text x="70" y="112" fill="#fff" font-family="Arial,sans-serif" font-size="40" font-weight="800">High-Level Architecture &amp; Security Model</text>
<text x="70" y="148" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Recruiter-safe overview — no credentials, secrets or sensitive implementation details.</text>
